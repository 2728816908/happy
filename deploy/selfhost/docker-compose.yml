services:
  happy-server:
    image: ${HAPPY_SERVER_IMAGE}
    container_name: happy-server
    restart: unless-stopped
    ports:
      - "${HAPPY_SERVER_PORT:-3005}:3005"
    environment:
      HANDY_MASTER_SECRET: ${HANDY_MASTER_SECRET}
      PUBLIC_URL: ${PUBLIC_URL}
      DATA_DIR: /data
      PGLITE_DIR: /data/pglite
      PORT: 3005
      HOST: 0.0.0.0
    volumes:
      - happy-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3005/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  happy-data:
