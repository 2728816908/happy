name: Build self-host Happy Server image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag
        required: true
        default: latest
  push:
    branches:
      - jacky-main
    paths:
      - Dockerfile
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - scripts/**
      - patches/**
      - packages/happy-server/**
      - packages/happy-wire/**
      - packages/happy-cli/**
      - packages/happy-agent/**
      - packages/happy-app/package.json
      - packages/happy-app/patches/**

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/happy-server

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        shell: bash
        run: |
          TAG_INPUT="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG_INPUT" ]; then TAG_INPUT="latest"; fi
          echo "tags=${REGISTRY}/${IMAGE_NAME}:${TAG_INPUT},${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
