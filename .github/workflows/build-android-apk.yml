name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: Self-hosted Happy server URL, for example https://happy.example.com
        required: true
      app_env:
        description: App environment
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
          - development

permissions:
  contents: read
  actions: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build wire package
        run: pnpm --filter @slopus/happy-wire build

      - name: Prebuild Android project
        working-directory: packages/happy-app
        env:
          APP_ENV: ${{ inputs.app_env }}
          EXPO_PUBLIC_HAPPY_SERVER_URL: ${{ inputs.server_url }}
        run: pnpm prebuild

      - name: Build release APK
        working-directory: packages/happy-app/android
        env:
          APP_ENV: ${{ inputs.app_env }}
          EXPO_PUBLIC_HAPPY_SERVER_URL: ${{ inputs.server_url }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: happy-${{ inputs.app_env }}-arm64.apk
          path: packages/happy-app/android/app/build/outputs/apk/release/app-release.apk
